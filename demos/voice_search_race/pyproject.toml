[project]
name = "voice-search-race-demo"
version = "0.1.0"
description = "One caller question, four search APIs, one stopwatch: a Gradium voice agent racing Keenable against Perplexity, Tavily and Exa"
requires-python = ">=3.12"
dependencies = [
    "gradbot",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
demo = "main:app"

[tool.uv.sources]
gradbot = { path = "../../gradbot_py" }
